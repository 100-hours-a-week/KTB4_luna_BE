name: Backend Image Publish

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: backend-image-publish
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.BACKEND_ECR_REPOSITORY }}

jobs:
  build-test-and-push:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SPRING_PROFILES_ACTIVE: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

      - name: Build and test
        run: bash ./gradlew build --no-daemon

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image URI
        id: image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: echo "uri=${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: docker build --platform linux/amd64 --tag "${{ steps.image.outputs.uri }}" .

      - name: Push Docker image
        run: docker push "${{ steps.image.outputs.uri }}"

      - name: Write job summary
        run: |
          echo 'ECR image tag: `${{ github.sha }}`' >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy backend to EC2
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          PARAMS=$(jq -cn \
            --arg tag "$GITHUB_SHA" \
            --arg region "$AWS_REGION" '{
            commands: [
              "set -e",
              "cd /opt/community/deploy",
              ("sed -i \"s/^BACKEND_IMAGE_TAG=.*/BACKEND_IMAGE_TAG=" + $tag + "/\" .env"),
              "REGISTRY=$(sed -n \"s/^ECR_REGISTRY=//p\" .env)",
              ("aws ecr get-login-password --region " + $region + " | docker login --username AWS --password-stdin \"$REGISTRY\""),
              "docker compose --env-file .env pull backend",
              "docker compose --env-file .env up -d --no-deps backend",
              "docker compose --env-file .env exec -T frontend nginx -s reload",
              "docker compose --env-file .env ps backend"
            ]
          }')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters "$PARAMS" \
            --query 'Command.CommandId' \
            --output text)

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"