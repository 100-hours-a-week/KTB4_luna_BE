spring.datasource.url=jdbc:mariadb://127.0.0.1:3307/community_benchmark
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.username=community
spring.datasource.password=benchmark-local
spring.h2.console.enabled=false

spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa-defer-datasource-initialization=true

jwt.secret=${JWT_SECRET}
jwt.access-token-expiration-ms=3600000
jwt.refresh-token-expiration-ms=1209600000

community.post.report-blind-threshold=3
